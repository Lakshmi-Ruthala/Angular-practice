<div class="row">
    <div class="col-8">
        <div class="card">
            <div class="card-header bg-success">
                New Client
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-12">
                        <table class="table table-bordered table-responsive">
                            <thead>
                                <tr>
                                    <th>S No</th>
                                    <th>Comapny Name </th>
                                    <th>Person Name </th>
                                    <th>Contact no</th>
                                    <th>City</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- <tr *ngFor="let item of clientList;let srno = index">
                                    <td>{{srno + 1}}</td>
                                    <td>{{item.companyName}}</td>
                                    <td>{{item.contactPersonName}}</td>
                                    <td>{{item.contactNo}}</td>
                                    <td>{{item.city}}</td>
                                    <td>
                                        <button class="btn btn-primary">Edit</button>
                                        <button class="btn btn-danger" >Delete</button>
                                    </td>
                                </tr> -->
                            </tbody>
                            <!-- <tr *ngFor="let item of roleList; let srno = index">
                                <td>{{srno + 1}}</td>
                                <td> {{item.lastName}}</td>
                                <td> {{item.firstName}}</td>
                                <td> {{item.bloodGroup}}</td>
                            </tr> -->
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-4">
        <div class="card">
            <div class="card-header bg-success">
                New Client
            </div>
            <div class="card-body">
                <form [formGroup]="projectForm">
                <div class="row">
                  
                     <div class="col-6 mt-2">
                        <label for="">project Name</label>
                        <input type="text" formControlName="projectName" class="form-control">
                    </div>
                    <div class="col-6 mt-2">
                        <label for="">Start Date</label>
                        <input type="text" formControlName="startDate" class="form-control">
                    </div>
                    <div class="col-6 mt-2">
                        <label for="">Expected End date</label>
                        <input type="text"  formControlName="expectedEndDate" class="form-control">
                    </div>
                    <div class="col-6 mt-2">
                        <label for="">Contact Name</label>
                        <input type="text" class="form-control" formControlName="contactPerson" >
                    </div>
                    <div class="col-6 mt-2">
                        <label for="">Contact Mobile</label>
                        <input type="text"  class="form-control" formControlName="contactPersonContactNo">
                    </div>
                    <div class="col-6 mt-2">
                        <label for="">Contact Email</label>
                        <input type="text" class="form-control" formControlName="contactPersonEmailId">
                    </div>
                    <div class="col-6 mt-2">
                        <label for="">Total Employee count</label>
                      <input type="text" class="form-control" formControlName="totalEmpWorking">
                    </div>
                    <div class="col-6 mt-2">
                        <label for="">Project Costing</label>
                        <input type="text"  class="form-control" formControlName="projectCost" >
                    </div>
                  
                       <div class="col-6 mt-2">
                        <label for="">Select Client </label>
                       <select name="" id="" formControlName="clientId">
                        <option value="" >Select Client</option>
                       </select>
                    </div>
                     <div class="col-6 mt-2">
                        <label for="">Lead By</label>
                       <select name="" id="" formControlName="leadByEmpId">
                        <option value="">Select Employee</option>
                       </select>
                    </div>
                      <div class="col-12 mt-2">
                        <label for="">Project Description</label>
                        <div>
                       <textarea name="" id="" formControlName="projectDetails"></textarea>
                       </div>
                    </div>
                </div>
                </form>
                <div class="row pt-2 text-center">
                    <div class="col-6">
                        <button class="btn btn-secondary">Cancel</button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-success">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
